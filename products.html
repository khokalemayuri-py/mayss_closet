<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collections | MAYSS CLOSET</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; }
        header { background-color: #1e293b; padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .logo { font-size: 26px; font-weight: 800; color: #f8fafc; text-decoration: none; letter-spacing: 2px; }
        .logo span { color: #f59e0b; }
        nav a { color: #cbd5e1; text-decoration: none; margin-left: 25px; font-weight: 600; font-size: 17px; }
        nav a:hover { color: #f59e0b; }
        .page-title { text-align: center; font-size: 32px; margin: 40px 0 10px 0; color: #f8fafc; }
        .page-subtitle { text-align: center; color: #94a3b8; margin-bottom: 40px; font-size: 16px; }
        .products-grid { width: 90%; max-width: 1300px; margin: 0 auto 60px auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .product-card { background-color: #1e293b; border: 1px solid #334155; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
        .product-img { width: 100%; height: 350px; object-fit: cover; }
        .product-details { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .product-title { font-size: 20px; font-weight: 700; color: #f1f5f9; margin-bottom: 8px; }
        .product-price { font-size: 22px; font-weight: bold; color: #f59e0b; margin-bottom: 16px; }
        .buy-btn { width: 100%; padding: 12px; background-color: #0284c7; color: #ffffff; border: none; border-radius: 6px; font-size: 16px; font-weight: 700; cursor: pointer; text-decoration: none; text-align: center; display: block; }
        .buy-btn:hover { background-color: #0369a1; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">MAYSS <span>CLOSET</span></a>
        <nav>
            <a href="index.html">Home</a>

            <a href="feedback.html">Feedback</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <h1 class="page-title">All Clothing Collections</h1>

    <div class="products-grid">

            <div class="product-details">
                <div>
                    <div class="product-title">Vintage Heavyweight Tee</div>
                    <div class="product-price">₹1,299</div>
                </div>

            </div>
        </div>
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1509967419530-da38b4704bc6?auto=format&fit=crop&w=600&q=80" class="product-img">
            <div class="product-details">
                <div>
                    <div class="product-title">Acid-Wash Pullover Hoodie</div>
                    <div class="product-price">₹2,499</div>
                </div>
                <a href="checkout.html" class="buy-btn">Buy Now</a>
            </div>
        </div>
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?auto=format&fit=crop&w=600&q=80" class="product-img">
            <div class="product-details">

                    <div class="product-title">Tactical Cargo Trousers</div>

                <a href="checkout.html" class="buy-btn">Buy Now</a>

    </div>
</body>
</html>
