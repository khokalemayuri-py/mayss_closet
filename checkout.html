<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | MAYSS CLOSET</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: #1e293b; padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .logo { font-size: 26px; font-weight: 800; color: #f8fafc; text-decoration: none; letter-spacing: 2px; }
        .logo span { color: #f59e0b; }
        nav a { color: #cbd5e1; text-decoration: none; margin-left: 25px; font-weight: 600; font-size: 17px; }
        .checkout-container { max-width: 600px; width: 90%; margin: 50px auto; background-color: #1e293b; padding: 40px; border-radius: 12px; border: 1px solid #334155; }
        h2 { font-size: 28px; color: #f59e0b; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 16px; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 14px; font-size: 16px; background-color: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; }
        .btn-order { width: 100%; padding: 16px; background-color: #22c55e; color: #fff; border: none; border-radius: 8px; font-size: 18px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">MAYSS <span>CLOSET</span></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Collections</a>
            <a href="feedback.html">Feedback</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <div class="checkout-container">
        <h2>Order Confirmation</h2>
        <form onsubmit="event.preventDefault(); alert('Order Placed Successfully!'); window.location.href='index.html';">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" required placeholder="Enter full name">
            </div>
            <div class="form-group">
                <label>Shipping Address</label>
                <input type="text" required placeholder="Enter delivery address">
            </div>
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" required placeholder="Enter contact number">
            </div>
            <button type="submit" class="btn-order">Place Order (Cash on Delivery)</button>
        </form>
    </div>
</body>
</html>
