<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Feedback | MAYSS CLOSET</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: #1e293b; padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .logo { font-size: 26px; font-weight: 800; color: #f8fafc; text-decoration: none; letter-spacing: 2px; }
        .logo span { color: #f59e0b; }
        nav a { color: #cbd5e1; text-decoration: none; margin-left: 25px; font-weight: 600; font-size: 17px; }
        .feedback-container { max-width: 700px; width: 90%; margin: 50px auto; background-color: #1e293b; padding: 40px; border-radius: 12px; border: 1px solid #334155; }
        h2 { font-size: 30px; color: #f59e0b; margin-bottom: 10px; text-align: center; }
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; font-size: 18px; font-weight: 600; margin-bottom: 10px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 16px; font-size: 17px; background-color: #0f172a; border: 1px solid #334155; color: #ffffff; border-radius: 8px; }
        .btn-submit { width: 100%; padding: 16px; background-color: #f59e0b; color: #0f172a; border: none; border-radius: 8px; font-size: 18px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">MAYSS <span>CLOSET</span></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Collections</a>
            <a href="feedback.html" style="color: #f59e0b;">Feedback</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <div class="feedback-container">
        <h2>Customer Feedback</h2>
        <form onsubmit="event.preventDefault(); alert('Thank you for your feedback!'); window.location.href='index.html';">
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" required placeholder="Enter full name">
            </div>
            <div class="form-group">
                <label>Rating</label>
                <select required>
                    <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                    <option value="4">⭐⭐⭐⭐ (4/5)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Your Review</label>
                <textarea rows="4" required placeholder="Write your feedback here..."></textarea>
            </div>
            <button type="submit" class="btn-submit">Submit Feedback</button>
        </form>
    </div>
</body>
</html>
